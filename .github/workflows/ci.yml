name: Project verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Enable Maven wrapper
        working-directory: backend
        run: chmod +x mvnw
      - name: Run deterministic domain tests
        working-directory: backend
        run: ./mvnw -B -pl ai-agent-station-study-domain -am test
      - name: Package all backend modules
        working-directory: backend
        run: ./mvnw -B -pl ai-agent-station-study-app -am -DskipTests package

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint -- --quiet
      - name: Production build
        working-directory: frontend
        run: npm run build
