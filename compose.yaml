name: ai-agent-station

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ai-agent-station-study
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/dev-ops/mysql/sql/ai-agent-station-study.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./docs/sql/agent-runtime-v2.sql:/docker-entrypoint-initdb.d/02-agent-runtime.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 12

  pgvector:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGVECTOR_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-change-me}
      POSTGRES_DB: ai-rag-knowledge
    ports:
      - "15432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./docs/dev-ops/pgvector/sql/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGVECTOR_USERNAME:-postgres} -d ai-rag-knowledge"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql-data:
  pgvector-data:
  redis-data:
